name: Trimly
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 8FCFVBQ4LK
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Trimly:
    path: ..
targets:
  TrimlyApp:
    type: application
    platform: macOS
    sources:
      - TrimlyApp
    dependencies:
      - package: Trimly
        product: TrimlyCore
    info:
      path: TrimlyApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: Trimly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleURLTypes:
          - CFBundleURLName: app.trimly.Trimly
            CFBundleURLSchemes: [trimly]
        NSDesktopFolderUsageDescription: Trimly, düzenlemek istediğin Masaüstü dosyalarını taramak ve taşımak için erişim ister.
        NSDownloadsFolderUsageDescription: Trimly, düzenlemek istediğin İndirilenler dosyalarını taramak ve taşımak için erişim ister.
        NSDocumentsFolderUsageDescription: Trimly, merkezi arşive dosya taşımak için Belgeler klasörüne erişim ister.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.trimly.Trimly
        PRODUCT_NAME: Trimly
        PRODUCT_MODULE_NAME: TrimlyApp
        ENABLE_APP_SANDBOX: NO
        # Generated keys (shown in Xcode's General tab) are merged with TrimlyApp/Resources/Info.plist,
        # which keeps what build settings cannot express (URL types, folder usage descriptions).
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Trimly
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
  TrimlyAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TrimlyAppTests
      - path: ../Tests/TrimlyCoreTests/Fixtures/TestFS.swift
      - path: ../Tests/TrimlyCoreTests/Fixtures/MockLLMProvider.swift
      - path: ../Tests/TrimlyCoreTests/Fixtures/Gate.swift
      - path: ../Tests/TrimlyCoreTests/Fixtures/GatedProvider.swift
    dependencies:
      - target: TrimlyApp
      - package: Trimly
        product: TrimlyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.trimly.TrimlyTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Trimly.app/Contents/MacOS/Trimly
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  TrimlyApp:
    build:
      targets:
        TrimlyApp: all
        TrimlyAppTests: [test]
    test:
      targets:
        - TrimlyAppTests
      environmentVariables:
        # The test host is the full app: keep its launch-time recovery and plans away from the real data directory.
        TRIMLY_DATA_DIR: /tmp/trimly-app-tests
